name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-curated-haven-web
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: my-curated-haven-web/.nvmrc
          cache: npm
          cache-dependency-path: my-curated-haven-web/package-lock.json

      - name: Print runtime
        env:
          COMMIT: ${{ github.sha }}
        run: |
          printf 'commit=%s\n' "$COMMIT"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Browser tests
        run: |
          list="$(npx playwright test --list)"
          printf '%s\n' "$list"
          printf '%s\n' "$list" | grep -Eq 'Total: [1-9][0-9]* tests'
          npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            my-curated-haven-web/playwright-report
            my-curated-haven-web/test-results
          retention-days: 7
          if-no-files-found: ignore
