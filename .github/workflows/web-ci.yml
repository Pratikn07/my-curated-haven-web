name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: my-curated-haven-web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      COMMERCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.104.0

      - name: Configure Supabase image registry
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> $GITHUB_ENV

      - name: Start Supabase stack
        working-directory: ${{ github.workspace }}
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          # public.ecr.aws sometimes answers "toomanyrequests: Data limit exceeded"
          # for long stretches. Skip containers the tests don't use (about 4.6 GB),
          # and fall back to the same images on Docker Hub for later attempts.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
              echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
            fi
            echo "supabase start attempt $attempt from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            if supabase start -x studio,analytics,vector,edge-runtime,imgproxy,realtime; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          supabase db reset

      - name: Export local Supabase test keys for browser fixtures
        working-directory: ${{ github.workspace }}
        run: |
          SERVICE_KEY="$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_KEY}" >> "$GITHUB_ENV"
          echo 'ADMIN_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres' >> "$GITHUB_ENV"

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: my-curated-haven-web/.nvmrc
          cache: npm
          cache-dependency-path: my-curated-haven-web/package-lock.json

      - name: Print runtime
        env:
          COMMIT: ${{ github.sha }}
        run: |
          printf 'commit=%s\n' "$COMMIT"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Phase 10 target and result accounting unit tests
        run: npm run test:phase10:unit

      - name: Homepage content unit tests
        run: npm run test:homepage:unit

      - name: Data access error-handling unit tests
        run: npm run test:data:unit

      - name: Admin inspection unit tests
        run: npm run test:admin:unit

      - name: Collection unit tests
        run: npm run test:collections:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Browser tests
        # The privacy spec needs its own instrumented build below; the rest of
        # the suite assumes the default build (no remote SDK).
        run: |
          list="$(npx playwright test --list $(ls tests/e2e/*.spec.ts | grep -v 'admin-privacy.spec.ts'))"
          printf '%s\n' "$list"
          printf '%s\n' "$list" | grep -Eq 'Total: [1-9][0-9]* tests'
          # Every collection acceptance spec must be discovered; a missing file fails here, not silently later.
          for spec in admin-collections-inspection admin-collections-editing admin-collections-review \
            admin-collections-publication admin-collections-access admin-collections-checkout \
            admin-collections-corrections admin-collections-operator admin-collections-concurrency admin-home; do
            printf '%s\n' "$list" | grep -q "${spec}.spec.ts" || { echo "Required spec ${spec} was not discovered"; exit 1; }
          done
          npm run test:e2e -- $(ls tests/e2e/*.spec.ts | grep -v 'admin-privacy.spec.ts')

      - name: Rebuild with the registry collection source
        env:
          COLLECTIONS_SOURCE_BACKEND: registry
        run: npm run build

      - name: Collection storefront tests (registry build)
        # The storefront spec skips itself on the default build, so it runs here with the registry source.
        # Desktop proves the database-backed pages; every project already covers the configured pages above.
        env:
          COLLECTIONS_SOURCE_BACKEND: registry
        run: npm run test:e2e -- tests/e2e/admin-collections-storefront.spec.ts tests/e2e/collections.spec.ts --project=chromium-desktop

      - name: Rebuild with instrumented analytics for the privacy spec
        env:
          # Test-only values baked in for the loopback sink intercepted by
          # Playwright (see ops/ADMIN-CONSOLE.md). Never point them at production.
          NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_POSTHOG_KEY: test-key-staging
          NEXT_PUBLIC_POSTHOG_HOST: http://127.0.0.1:54349/sink
        run: npm run build

      - name: Privacy browser tests (instrumented build)
        run: npm run test:e2e -- tests/e2e/admin-privacy.spec.ts

      - name: Assemble Phase 10 scenario evidence
        if: always()
        env:
          PHASE10_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PHASE10_INTEGRATION_SHA: ${{ github.sha }}
        run: npm run report:phase10 -- --report=test-results/phase10-playwright.json --output-dir=phase10-evidence

      - name: Upload sanitized browser scenario summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10-scenarios-${{ github.run_id }}
          path: my-curated-haven-web/phase10-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            my-curated-haven-web/playwright-report
            my-curated-haven-web/test-results
          retention-days: 7
          if-no-files-found: ignore

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.104.0

      - name: Configure Supabase image registry
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> $GITHUB_ENV

      - name: Start Supabase stack
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          # public.ecr.aws sometimes answers "toomanyrequests: Data limit exceeded"
          # for long stretches. Skip containers the tests don't use (about 4.6 GB),
          # and fall back to the same images on Docker Hub for later attempts.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
              echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io" >> "$GITHUB_ENV"
            fi
            echo "supabase start attempt $attempt from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            if supabase start -x studio,analytics,vector,edge-runtime,imgproxy,realtime; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done

      - name: Verify clean migration replay
        run: supabase db reset

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: my-curated-haven-web/.nvmrc
          cache: npm
          cache-dependency-path: my-curated-haven-web/package-lock.json

      - name: Install dependencies
        working-directory: my-curated-haven-web
        run: npm ci

      - name: Run every database test (pgTAP)
        # The runner bundles the shared fixtures that raw `supabase test db` cannot include and fails when it
        # selects no files. The required collection suites must all be present.
        working-directory: my-curated-haven-web
        run: |
          required="$(ls ../supabase/tests/database | grep -cE '^(1[7-9]|2[0-7]|56)_[a-z_]*admin[a-z_]*\.test\.sql$')"
          test "$required" -ge 12 || { echo "Expected 12 collection admin suites, found $required"; exit 1; }
          node scripts/test-admin-db.mjs --all

      - name: Verify generated TypeScript types drift
        run: |
          supabase gen types typescript --local > types.gen.ts
          diff -u my-curated-haven-web/src/lib/types/database.ts types.gen.ts

      - name: Install Chromium for data tests
        working-directory: my-curated-haven-web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        working-directory: my-curated-haven-web
        run: npm run build

      - name: Run data access integration tests
        working-directory: my-curated-haven-web
        run: npx playwright test tests/e2e/data-access.spec.ts --project=chromium-desktop

      - name: Assemble Phase 10 database scenario evidence
        if: always()
        working-directory: my-curated-haven-web
        env:
          PHASE10_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PHASE10_INTEGRATION_SHA: ${{ github.sha }}
        run: npm run report:phase10 -- --report=test-results/phase10-playwright.json --output-dir=phase10-evidence/backend

      - name: Upload sanitized database scenario summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase10-database-scenarios-${{ github.run_id }}
          path: my-curated-haven-web/phase10-evidence/backend
          retention-days: 30
          if-no-files-found: error

      - name: Upload database failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-access-failure-${{ github.run_id }}
          path: |
            my-curated-haven-web/playwright-report
            my-curated-haven-web/test-results
          retention-days: 7
          if-no-files-found: ignore
